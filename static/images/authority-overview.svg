<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="t d"><title id="t">Help is also a negotiation</title><desc id="d">Three relationships from the analysis: knowledge and decision rights; choice and decision scope; task progress and agreement.</desc>
<rect width="1120" height="430" rx="14" fill="#f5f8f9"/><g font-family="Avenir Next,Avenir,sans-serif"><text x="42" y="47" font-size="13" letter-spacing="2" font-weight="600" fill="#267278">THE CONTESTABILITY OF HELP</text><text x="42" y="90" font-size="31" font-weight="650" fill="#303338">An answer is only part of the interaction.</text>
<g transform="translate(42 125)"><rect width="326" height="222" rx="10" fill="white" stroke="#dae4e7"/><text x="22" y="35" font-size="13" letter-spacing="1" fill="#267278">01 / KNOWLEDGE</text><text x="22" y="77" font-size="22" font-weight="600" fill="#303338">Who knows?</text><path d="M23 107h279" stroke="#e3e9ea"/><text x="22" y="142" font-size="22" font-weight="600" fill="#416a93">Who decides?</text><text x="22" y="180" font-size="15" fill="#687077">Expertise does not settle every</text><text x="22" y="202" font-size="15" fill="#687077">decision about assistance.</text></g>
<g transform="translate(397 125)"><rect width="326" height="222" rx="10" fill="white" stroke="#dae4e7"/><text x="22" y="35" font-size="13" letter-spacing="1" fill="#267278">02 / DECISION SCOPE</text><text x="22" y="77" font-size="22" font-weight="600" fill="#303338">Which option?</text><path d="M23 107h279" stroke="#e3e9ea"/><text x="22" y="142" font-size="22" font-weight="600" fill="#416a93">Whether to act?</text><text x="22" y="180" font-size="15" fill="#687077">An offered choice may miss</text><text x="22" y="202" font-size="15" fill="#687077">the child's actual objection.</text></g>
<g transform="translate(752 125)"><rect width="326" height="222" rx="10" fill="white" stroke="#dae4e7"/><text x="22" y="35" font-size="13" letter-spacing="1" fill="#267278">03 / AGREEMENT</text><text x="22" y="77" font-size="22" font-weight="600" fill="#303338">Task completed?</text><path d="M23 107h279" stroke="#e3e9ea"/><text x="22" y="142" font-size="22" font-weight="600" fill="#416a93">Help accepted?</text><text x="22" y="180" font-size="15" fill="#687077">Continued participation does not</text><text x="22" y="202" font-size="15" fill="#687077">necessarily resolve disagreement.</text></g>
<text x="560" y="391" text-anchor="middle" font-size="16" fill="#52686d">A design question: can the person receiving help influence what happens next?</text></g></svg>
