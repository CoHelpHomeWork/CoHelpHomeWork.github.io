<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="t d"><title id="t">Knowledge is not a single position</title><desc id="d">Different knowledge claims inform the negotiation of help: the answer, the child's learning experience, and classroom requirements.</desc><rect width="1120" height="440" rx="10" fill="#fafcfc"/><g font-family="Avenir Next,Avenir,sans-serif"><text x="44" y="45" font-size="13" letter-spacing="2" fill="#267278">FINDING 01</text><text x="44" y="87" font-size="30" font-weight="600" fill="#303338">Knowing the material. Defining the need.</text>
<g fill="white" stroke="#dce6e8"><rect x="44" y="128" width="305" height="159" rx="9"/><rect x="407" y="128" width="305" height="159" rx="9"/><rect x="770" y="128" width="305" height="159" rx="9"/></g>
<g fill="#267278" font-size="13" font-weight="600" letter-spacing="1"><text x="67" y="163">SUBJECT KNOWLEDGE</text><text x="430" y="163">LEARNING EXPERIENCE</text><text x="793" y="163">CLASSROOM CONTEXT</text></g>
<g fill="#303338" font-size="23" font-weight="600"><text x="67" y="204">The answer or method</text><text x="430" y="204">How I want to learn</text><text x="793" y="204">What school requires</text></g>
<g fill="#687077" font-size="16"><text x="67" y="244">An explanation can supply</text><text x="67" y="267">relevant task information.</text><text x="430" y="244">A child can describe a need</text><text x="430" y="267">without rejecting all help.</text><text x="793" y="244">A classroom requirement can</text><text x="793" y="267">differ from a parent's approach.</text></g>
<path d="M197 288v32h363m363-32v32H560m0-32v58" fill="none" stroke="#7b9caa" stroke-width="2"/><path d="m555 341 5 7 5-7" fill="none" stroke="#7b9caa" stroke-width="2"/><rect x="255" y="351" width="610" height="49" rx="24" fill="#eaf3f3"/><text x="560" y="382" text-anchor="middle" font-size="18" font-weight="600" fill="#267278">Which claim does the next response actually address?</text></g></svg>
