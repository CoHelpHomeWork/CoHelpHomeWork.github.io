<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="t d"><title id="t">Two tracks in one interaction</title><desc id="d">Task progress is acknowledged by the parent while the child continues to question dependence on a recording; uptake can also coexist with continued guidance.</desc><rect width="1120" height="440" rx="10" fill="#fafcfc"/><g font-family="Avenir Next,Avenir,sans-serif"><text x="44" y="45" font-size="13" letter-spacing="2" fill="#267278">FINDING 03 · CASE C</text><text x="44" y="87" font-size="30" font-weight="600" fill="#303338">Finishing the task does not finish the negotiation.</text>
<text x="44" y="159" font-size="14" letter-spacing="1" font-weight="600" fill="#416a93">TASK PROGRESS</text><path d="M230 155h225" stroke="#98afc6" stroke-width="2"/><path d="m449 150 7 5-7 5" fill="none" stroke="#98afc6" stroke-width="2"/><rect x="469" y="125" width="606" height="81" rx="8" fill="#eff4fa" stroke="#d5e0ec"/><text x="492" y="157" font-size="13" fill="#416a93">PARENT ACKNOWLEDGES COMPLETION</text><text x="492" y="185" font-size="21" font-weight="500" fill="#303338">“Okay, you read it through. Good.”</text>
<text x="44" y="263" font-size="14" letter-spacing="1" font-weight="600" fill="#267278">HELP ARRANGEMENT</text><path d="M230 259h225" stroke="#70a3a5" stroke-width="2" stroke-dasharray="5 5"/><path d="m449 254 7 5-7 5" fill="none" stroke="#70a3a5" stroke-width="2"/><rect x="469" y="229" width="606" height="81" rx="8" fill="#edf6f5" stroke="#cbdedc"/><text x="492" y="261" font-size="13" fill="#267278">CHILD CONTINUES TO QUESTION RELIANCE</text><text x="492" y="289" font-size="20" font-weight="500" fill="#303338">“I want to rely on myself, rather than on that recording.”</text>
<rect x="44" y="348" width="1031" height="50" rx="7" fill="#f1f3f4"/><text x="560" y="379" text-anchor="middle" font-size="16" fill="#5f6d73">Design implication: evaluate task progress and responses to objections separately.</text></g></svg>
