<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="t d"><title id="t">A choice at the wrong level</title><desc id="d">An offered choice of recipient differs from a child's objection to sharing itself. The outcome of actual sharing is unknown.</desc><rect width="1120" height="440" rx="10" fill="#fafcfc"/><g font-family="Avenir Next,Avenir,sans-serif"><text x="44" y="45" font-size="13" letter-spacing="2" fill="#267278">FINDING 02 · CASE A</text><text x="44" y="87" font-size="30" font-weight="600" fill="#303338">The option is open. Is the decision?</text>
<rect x="44" y="131" width="470" height="204" rx="10" fill="#f0f4f9" stroke="#d5e0ec"/><text x="70" y="169" font-size="13" letter-spacing="1" font-weight="600" fill="#416a93">PARENT'S OFFERED CHOICE</text><text x="70" y="216" font-size="26" font-weight="600" fill="#303338">Whom should I send it to?</text><rect x="70" y="252" width="182" height="48" rx="24" fill="white" stroke="#b8c8dc"/><rect x="270" y="252" width="182" height="48" rx="24" fill="white" stroke="#b8c8dc"/><text x="161" y="282" text-anchor="middle" font-size="17" fill="#416a93">Recipient 1</text><text x="361" y="282" text-anchor="middle" font-size="17" fill="#416a93">Recipient 2</text>
<path d="M543 219h35m-18-14 17 14-17 14" fill="none" stroke="#8c9da3" stroke-width="2"/><text x="560" y="259" text-anchor="middle" font-size="12" fill="#687077">different</text><text x="560" y="277" text-anchor="middle" font-size="12" fill="#687077">scope</text>
<rect x="606" y="131" width="470" height="204" rx="10" fill="#edf6f5" stroke="#cbdedc"/><text x="632" y="169" font-size="13" letter-spacing="1" font-weight="600" fill="#267278">CHILD'S OBJECTION</text><text x="632" y="216" font-size="26" font-weight="600" fill="#303338">Should it be sent at all?</text><text x="632" y="270" font-size="19" fill="#267278">“You can't send it to anyone.”</text><text x="632" y="303" font-size="14" fill="#687077">Challenges the premise shared by both options</text>
<text x="560" y="387" text-anchor="middle" font-size="16" fill="#687077">The exchange establishes a mismatch in decision scope, not an actual disclosure.</text></g></svg>
